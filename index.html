<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2334b36a'/%3E%3Cpath d='M6 24l7-13 4 7 2.2-3.4L26 24z' fill='%230c1a12'/%3E%3C/svg%3E" />
    <title>青屿沙盘 · 植被散布工具</title>
  </head>
  <body>
    <div class="app-shell" data-testid="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
              <path d="M3 18.5 9.2 7l3.6 6.2 2-3.2L21 18.5H3Z" fill="currentColor" opacity=".9"/>
              <path d="M3 18.5h18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </span>
          <div class="brand-text">
            <strong>青屿沙盘</strong>
            <span>植被散布工作台</span>
          </div>
        </div>
        <veg-toolbar data-testid="toolbar"></veg-toolbar>
      </header>

      <aside class="panel panel-left" aria-label="散布参数面板">
        <scatter-panel data-testid="scatter-panel"></scatter-panel>
      </aside>

      <main class="viewport-wrap" data-testid="viewport-wrap">
        <viewport-canvas data-testid="viewport-canvas"></viewport-canvas>
        <height-band-control
          class="band-dock"
          data-testid="height-band"
        ></height-band-control>
      </main>

      <aside class="panel panel-right" aria-label="图层列表">
        <layer-list data-testid="layer-list"></layer-list>
      </aside>

      <div id="toast-root" class="toast-root" data-testid="toast-root"></div>
      <input type="file" id="import-file-input" accept="application/json,.json" hidden data-testid="import-file-input" />
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
